spring:
  application:
    name: internal-wallet-service

  datasource:
    # set these as environment variables — see README for values
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      # supabase free tier caps at 60 connections total
      maximum-pool-size: 10
      minimum-idle: 2

      # fail fast if pool is exhausted — better to return 503 quickly than make callers wait 30s
      connection-timeout: 3000
      validation-timeout: 3000

      # supabase drops idle connections after ~5 minutes
      idle-timeout: 240000
      keepalive-time: 120000
      max-lifetime: 600000

      # applied on every new connection:
      # lock_timeout — if a SELECT FOR UPDATE waits more than 3s, abort and return 503
      # statement_timeout — kill any query running longer than 10s
      connection-init-sql: "SET search_path=public; SET lock_timeout='3s'; SET statement_timeout='10s'"

  jpa:
    hibernate:
      # flyway manages the schema, hibernate should not touch it
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    # disabled here — flyway is bootstrapped manually in FlywayConfig.java
    # so we can control the order relative to entityManagerFactory
    enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  # render/railway inject PORT at runtime, fallback to 8080 locally
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
